name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app:
        description: "App to publish (folder name under apps/)"
        required: false
        default: web
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Single source of truth for which app gets published. `inputs.app` only
# fires on workflow_dispatch; `vars.PAGES_APP` is the repo-level fallback
# for the push trigger; `web` is the dean-stack default.
env:
  APP: ${{ github.event.inputs.app || vars.PAGES_APP || 'web' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_GAME_TITLE: ${{ vars.VITE_GAME_TITLE || 'dean-stack' }}
      # SEO contract — see apps/web/app/env.ts for the full schema and the
      # README "SEO and social" section for what each var controls.
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
      VITE_SITE_DESCRIPTION: ${{ vars.VITE_SITE_DESCRIPTION || 'Rapid-prototyping platform for browser games — built live on an iPad over LAN, deployed static to GitHub Pages.' }}
      VITE_OG_IMAGE: ${{ vars.VITE_OG_IMAGE }}
      VITE_AUTHOR_NAME: ${{ vars.VITE_AUTHOR_NAME }}
      VITE_AUTHOR_URL: ${{ vars.VITE_AUTHOR_URL }}
      VITE_TWITTER_HANDLE: ${{ vars.VITE_TWITTER_HANDLE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: "package.json"

      # Configure Pages emits the canonical base_path for the deploy target —
      # "/<repo>/" for project pages, "/" for user/org pages and custom
      # domains. Driving BASE_PATH from this output instead of hardcoding
      # "/dean-stack/" makes the workflow portable to any fork or rename.
      - id: pages
        uses: actions/configure-pages@v5

      - run: bun install --frozen-lockfile

      # Playwright's browser binary is not bundled with the npm package; the
      # gate's `playwright test` step fails on a fresh runner without it.
      # `--with-deps` installs OS libs Chromium needs on ubuntu-latest.
      #
      # `working-directory: apps/web` is LOAD-BEARING. `@playwright/test`
      # is only a direct dep in `apps/web/package.json` — running `bunx
      # playwright install` from the repo root makes `bunx` fall back to
      # fetching the LATEST `playwright` from npm, which installs
      # browsers for a different internal revision than the workspace-
      # pinned version. The gate then fails with "Executable doesn't
      # exist at chromium_headless_shell-<N>" because the workspace
      # Playwright is looking for a different revision. Running the
      # install from the workspace pins `bunx` to the workspace dep.
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web

      # Pillar 4 — the gate runs BEFORE the production build so we never
      # publish code that fails lint, types, unit, or e2e. This is the only
      # CI surface that runs on push to main; check.yml is PR-only.
      - run: bun run check

      # Build only the selected app with the production base path. Turbo
      # respects the filter; the inner build script writes to
      # apps/<app>/dist/client. (The gate's build above used `/` as base
      # for Playwright preview; this rebuild emits the prod-base artifact.)
      - name: Build ${{ env.APP }}
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bun run build --filter=@dean-stack/${{ env.APP }}

      - name: Verify SSG output
        run: |
          set -euo pipefail
          dir="apps/${APP}/dist/client"
          test -f "$dir/index.html" || (echo "missing $dir/index.html" && exit 1)
          test -f "$dir/404.html"   || (echo "missing $dir/404.html" && exit 1)
          test -f "$dir/.nojekyll"  || (echo "missing $dir/.nojekyll" && exit 1)
          echo "SSG output OK at $dir"

      - uses: actions/upload-pages-artifact@v3
        with:
          # TanStack Start in SPA + prerender mode emits the static artifact
          # at apps/<app>/dist/client. The build script copies index.html →
          # 404.html and touches .nojekyll for GH Pages.
          path: apps/${{ env.APP }}/dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
