name: fallow

# fallow runs on PRs as a separate signal from `check` and `react-doctor`.
# `dead-code --fail-on-issues` is the gate (no unused files / exports / deps,
# no circular dependencies, no boundary violations). The full `fallow` run
# (which also computes complexity health) is informational — the report is
# uploaded as an artifact for review, not a gate.
#
# Why separate from `check.yml`: dead-code analysis is whole-codebase, not
# diff-scoped — it scans the PR head's full state, not the diff against
# main. We still pin `ref: ${{ github.head_ref }}` (same as react-doctor)
# so the scan reports on what the author wrote, not on a synthetic merge
# commit that mixes in main's current state.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR head BY NAME, not the synthetic merge SHA.
          # The default `pull_request` checkout is a merge commit (PR head
          # merged into base), which mixes main's current state into the
          # scan — making fallow's "current state on this branch" report
          # depend on whether main has moved since branch-off. Pinning to
          # `head_ref` makes the scan deterministic for the PR author.
          # Same pattern as `react-doctor.yml`.
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      # Gate: dead-code only. Exits 1 on any unused file / export / type /
      # dependency / circular dep / boundary violation. `--format json
      # --quiet` keeps output machine-parseable; `2>/dev/null` discards
      # progress messages so the JSON on stdout is clean.
      - name: fallow — dead-code gate
        run: npx -y fallow@latest dead-code --fail-on-issues --format json --quiet 2>/dev/null

      # Informational: full run (dead-code + duplication + complexity health).
      # `|| true` so this step never fails the build — health hotspots are
      # advisory; the dead-code gate above is the real signal.
      - name: fallow — full health report (advisory)
        run: npx -y fallow@latest --format json --quiet 2>/dev/null > /tmp/fallow-report.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fallow-report
          path: /tmp/fallow-report.json
          retention-days: 14
