name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: "package.json"

      - run: bun install --frozen-lockfile

      # Playwright's browser binary is not bundled with the npm package; the
      # gate's `playwright test` step fails on a fresh runner without it.
      # `--with-deps` installs OS libs Chromium needs on ubuntu-latest.
      - run: bunx playwright install --with-deps chromium

      - run: bun run check
        env:
          VITE_GAME_TITLE: ${{ vars.VITE_GAME_TITLE || 'dean-stack' }}
