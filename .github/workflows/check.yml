name: check

# PR-only. The push-to-main path runs the gate inside `deploy.yml`'s
# `build` job (Pillar 4 — gate before deploy). Triggering check on push
# would create a side-by-side workflow run alongside deploy that does
# nothing the deploy job isn't already doing — see five-phase-pass
# sweep-token "duplicate workflow trigger on push to main".
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: "package.json"

      - run: bun install --frozen-lockfile

      # Playwright's browser binary is not bundled with the npm package; the
      # gate's `playwright test` step fails on a fresh runner without it.
      # `--with-deps` installs OS libs Chromium needs on ubuntu-latest.
      - run: bunx playwright install --with-deps chromium

      - run: bun run check
        env:
          VITE_GAME_TITLE: ${{ vars.VITE_GAME_TITLE || 'dean-stack' }}
