name: react-doctor

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required for --diff against base

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      # Direct invocation, mirrors the local pre-push gate (`bun run check:fast`).
      # We do NOT use the `millionco/react-doctor` wrapper action: it runs a
      # second `--score` step on the FULL codebase under `pipefail`, and
      # react-doctor exits non-zero whenever any issues exist anywhere.
      # Result: every PR was failing on pre-existing issues outside the diff,
      # ignoring the wrapper's own `fail-on: none` flag (which only applies
      # to its first step). Direct invocation gates only on diff issues —
      # exactly what the local gate enforces, so CI red ⇔ local red.
      - name: react-doctor — diff scan
        run: npx -y react-doctor@latest . --diff "${{ github.base_ref }}" --verbose
