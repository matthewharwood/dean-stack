name: react-doctor

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required for --diff against base

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - uses: millionco/react-doctor@main
        with:
          # Use the PR's actual base branch so the diff works whether the
          # repo's default branch is `main` or `master`.
          diff: ${{ github.base_ref }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on: none
          verbose: "true"
